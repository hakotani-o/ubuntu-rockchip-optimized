name: v1-clean-build
on:
  workflow_dispatch:
   inputs:
      mesa_source:
        description: 'Select Mesa source'
        required: true
        default: 'upstream'
        type: choice
        options:
          - upstream
          - ubuntu
      build_type:
        description: 'Build type (desktop or server)'
        required: true
        default: 'desktop'
        type: choice
        options:
          - desktop
          - server

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  command:
    name: Clean build disk images with Mesa for Rockchip
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

# 2. Build all packages and disk images
      - name: Build all package and disk images
        env: 
           mesa_source: ${{ github.event.inputs.mesa_source }}
           build_type: ${{ github.event.inputs.build_type }}
        run: |
          # Fix CRLF line endings from Windows (otherwise #!/bin/bash\r won't be found)
          sed -i 's/\r$//' *.sh
          mkdir -p build/overlay build/kernel build/images
          cp *.sh build
          cp my-add.txt libdrm-amdgpu1.symbols.patch build/overlay
          cd build
          chmod +x *.sh
          BUILD_TYPE=$build_type ./main-control.sh $mesa_source
          cd ..
          echo " ------------- overlay -------------------"
          ls build/overlay/
          echo " ------------- kernel --------------------"
          ls build/kernel/
          echo " ------------ images ----------------------"
          ls build/images/

      - name: Get current date
        id: date
        run: echo "now=$(date +'%Y-%m-%d %H:%M')" >> $GITHUB_OUTPUT

      - name: Get kernel version
        id: kernel
        run: cat ./build/overlay/kernel_version >> $GITHUB_OUTPUT

      - name: Mesa version
        id: mesa
        run: echo "release_mesa_info=$(cat ./build/overlay/rel.txt)" >> $GITHUB_OUTPUT
        

        # Fix file permissions before release
      - name: Fix file permissions
        run: sudo chown -R runner:runner ./build/overlay/* ./build/kernel/* ./build/images/*
      
      - name: Create Release and Upload
        uses: softprops/action-gh-release@v2
        with:
          # Unique tag per run (e.g. build-1, build-2...)
          tag_name: build-${{ github.run_number }}
          name: "Orange Pi 5 / 5 PLUS eMMC Disk Image Build ${{ github.run_number }}"
          body: |
            Orange Pi 5 / 5 PLUS eMMC disk image with Mesa for Rockchip
            U-Boot BOOT_TARGETS: mmc1 mmc0 nvme scsi (SD card & eMMC)
            Build date: ${{ steps.date.outputs.now }}
            Kernel: ${{ steps.kernel.outputs.kernel_version }}
            Mesa: ${{ steps.mesa.outputs.release_mesa_info }}
          draft: false
          prerelease: false
          # Compressed image path
          files: |
            ./build/images/Ubuntu-*img.xz 
            ./build/overlay/*.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}



